name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Typecheck + all test suites
        run: npm run test:all
        env:
          CI: "true"
      - name: SBOM
        run: npm run sbom